<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2F5233">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="محاسبة">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%232F5233' rx='20'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='white'>📿</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%232F5233'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='white'>📿</text></svg>">
<title>محاسبة النفس</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Traditional Arabic', 'Amiri', 'Times New Roman', serif;
    direction: rtl;
    background-color: #FAF6EE;
    color: #2C2416;
    min-height: 100vh;
    padding: 14px;
    max-width: 600px;
    margin: 0 auto;
    line-height: 1.6;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #2F5233 0%, #4A7C50 100%);
    color: white;
    padding: 18px;
    border-radius: 14px;
    margin-bottom: 14px;
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; }
  .title { font-size: 26px; font-weight: bold; }
  .subtitle { font-size: 14px; opacity: 0.85; margin-top: 4px; }
  .score-circle {
    width: 70px; height: 70px; border-radius: 50%;
    background: rgba(255,255,255,0.18);
    border: 3px solid rgba(255,255,255,0.4);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  .score-num { font-size: 18px; font-weight: bold; }
  .score-label { font-size: 11px; opacity: 0.8; }
  .save-status { margin-top: 8px; font-size: 12px; opacity: 0.85; text-align: center; height: 16px; }

  /* TABS */
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab {
    flex: 1; padding: 10px 8px;
    background: white;
    border: 1.5px solid #C9B68B;
    border-radius: 10px;
    font-size: 14px; font-family: inherit;
    cursor: pointer; color: #5C4A2A; font-weight: bold;
  }
  .tab.active { background: #2F5233; color: white; border-color: #2F5233; }

  /* BANNER */
  .banner {
    background: #FFF8E7;
    border: 1.5px solid #D4A574;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
    display: flex; gap: 12px; align-items: center;
  }
  .banner-icon { font-size: 28px; }
  .banner-text { font-size: 13px; color: #5C4A2A; line-height: 1.7; flex: 1; }

  /* CATEGORY */
  .category {
    background: white;
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .cat-header {
    padding: 14px 16px; color: white; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    user-select: none;
  }
  .cat-header-left { display: flex; align-items: center; gap: 10px; }
  .cat-header-right { display: flex; align-items: center; gap: 12px; }
  .cat-icon { font-size: 22px; }
  .cat-title { font-size: 17px; font-weight: bold; }
  .cat-score {
    font-size: 14px;
    background: rgba(255,255,255,0.22);
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: bold;
  }
  .cat-arrow { font-size: 12px; transition: transform 0.2s; }
  .cat-arrow.collapsed { transform: rotate(180deg); }
  .cat-body { padding: 8px 0; display: none; }
  .cat-body.expanded { display: block; }

  /* ITEM ROW */
  .item-row {
    display: flex; align-items: center;
    padding: 11px 16px; gap: 12px;
    cursor: pointer; transition: background 0.15s;
    border-bottom: 1px solid #F5EFE6;
  }
  .item-row.checked { background: #FAFAF5; }
  .item-row-count {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 16px; gap: 12px;
    border-bottom: 1px solid #F5EFE6;
  }
  .checkbox {
    width: 24px; height: 24px;
    border-radius: 6px;
    border: 2px solid #C9B68B;
    background: white;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.15s;
  }
  .checkbox.checked { border: 2px solid; }
  .checkbox .checkmark { color: white; font-size: 16px; font-weight: bold; display: none; }
  .checkbox.checked .checkmark { display: block; }
  .item-label { font-size: 15px; color: #2C2416; flex: 1; line-height: 1.5; }
  .item-label.checked { color: #6B6055; }

  .counter { display: flex; align-items: center; gap: 10px; }
  .counter-btn {
    width: 30px; height: 30px;
    border-radius: 6px; border: none;
    color: white; font-size: 18px; font-weight: bold;
    cursor: pointer; font-family: inherit;
  }
  .counter-value {
    font-size: 17px; font-weight: bold;
    min-width: 28px; text-align: center; color: #2F5233;
  }

  /* REFLECTION */
  .reflection {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-top: 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .reflection-title {
    font-size: 19px; font-weight: bold;
    color: #2F5233;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 2px double #B8860B;
    text-align: center;
  }
  .notes-group { margin-bottom: 16px; }
  .notes-label {
    display: block; font-size: 14px;
    color: #5C4A2A; margin-bottom: 6px; font-weight: bold;
  }
  textarea {
    width: 100%; padding: 10px;
    border: 1.5px solid #C9B68B;
    border-radius: 8px;
    font-family: inherit; font-size: 14px;
    direction: rtl; text-align: right;
    resize: vertical;
    background: #FAFAF5;
    color: #2C2416;
    line-height: 1.7;
  }

  /* DUA CARD */
  .dua-card {
    background: #FFF8E7;
    border: 2px solid #D4A574;
    border-radius: 12px;
    padding: 18px;
    margin-top: 18px;
  }
  .dua-title {
    font-size: 17px; font-weight: bold;
    color: #8B4513;
    text-align: center;
    margin-bottom: 10px;
  }
  .dua-text {
    font-size: 15px;
    color: #2C2416;
    line-height: 2;
    text-align: justify;
  }

  /* HISTORY */
  .hist-title {
    font-size: 18px; font-weight: bold;
    color: #2F5233; margin-bottom: 12px;
  }
  .hist-row {
    background: white;
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    border-right: 4px solid #2F5233;
  }
  .hist-row-arrow { color: #8B6914; font-size: 18px; }
  .back-btn {
    background: transparent; border: none;
    color: #8B6914; font-size: 15px;
    cursor: pointer; font-family: inherit;
    font-weight: bold; margin-bottom: 10px; padding: 6px;
  }
  .hist-day-title {
    font-size: 18px; font-weight: bold;
    color: #2F5233; text-align: center; margin-bottom: 8px;
  }
  .score-circle-large {
    width: 100px; height: 100px;
    background: #2F5233 !important;
    border: 4px solid #B8860B !important;
    margin: 20px auto;
  }
  .score-circle-large .score-num { font-size: 22px; color: white; }
  .score-circle-large .score-label { color: white; opacity: 0.8; }
  .hist-cat {
    background: white; border-radius: 10px;
    padding: 14px; margin-bottom: 10px;
  }
  .hist-cat-header {
    font-size: 16px; font-weight: bold;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid #F5EFE6;
  }
  .hist-item { font-size: 14px; padding: 4px 0; color: #2C2416; }
  .hist-item.missed { color: #999; }
  .hist-check { color: #2F5233; font-weight: bold; margin-left: 6px; }
  .hist-x { color: #C0C0C0; margin-left: 6px; }
  .hist-notes {
    background: #FFF8E7; padding: 14px;
    border-radius: 10px; margin-top: 10px;
  }
  .hist-notes-title {
    font-size: 16px; font-weight: bold;
    color: #8B4513; margin-bottom: 8px;
  }
  .hist-note {
    font-size: 14px; color: #2C2416;
    margin-bottom: 6px; line-height: 1.7;
  }

  /* STATS */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }
  .stat-card {
    background: white;
    padding: 16px;
    border-radius: 12px;
    text-align: center;
    border-top: 3px solid #B8860B;
  }
  .stat-value { font-size: 26px; font-weight: bold; color: #2F5233; }
  .stat-label { font-size: 12px; color: #5C4A2A; margin-top: 4px; }
  .stat-section {
    background: white; padding: 16px;
    border-radius: 12px; margin-bottom: 14px;
  }
  .stat-section-title {
    font-size: 16px; font-weight: bold;
    color: #2F5233; margin-bottom: 14px; text-align: center;
  }
  .cat-bar { margin-bottom: 12px; }
  .cat-bar-label {
    display: flex; justify-content: space-between;
    font-size: 13px; margin-bottom: 5px; color: #2C2416;
  }
  .cat-bar-track {
    width: 100%; height: 8px;
    background: #F0E6D2;
    border-radius: 4px;
    overflow: hidden;
  }
  .cat-bar-fill {
    height: 100%; border-radius: 4px;
    transition: width 0.5s;
  }
  .best-day {
    background: #FFF8E7;
    border: 2px solid #D4A574;
    padding: 16px;
    border-radius: 12px;
    text-align: center;
    margin-bottom: 14px;
  }
  .best-day-title {
    font-size: 13px; color: #8B4513;
    margin-bottom: 4px; font-weight: bold;
  }
  .best-day-date { font-size: 15px; color: #2C2416; margin-bottom: 4px; }
  .best-day-score { font-size: 20px; font-weight: bold; color: #2F5233; }
  .motivation {
    background: #2F5233; color: white;
    padding: 16px; border-radius: 12px;
    text-align: center; font-size: 14px; line-height: 1.8;
  }
  .empty-state {
    text-align: center; padding: 40px 20px;
    background: white; border-radius: 12px;
  }
  .empty-icon { font-size: 50px; margin-bottom: 12px; }
  .empty-text {
    font-size: 17px; color: #5C4A2A;
    font-weight: bold; margin-bottom: 6px;
  }
  .empty-hint { font-size: 13px; color: #8B7355; }

  /* INSTALL HINT */
  .install-hint {
    background: #2F5233; color: white;
    padding: 14px; border-radius: 10px;
    margin-bottom: 14px; font-size: 13px;
    text-align: center; line-height: 1.8;
    cursor: pointer;
    position: relative;
  }
  .install-hint .close-btn {
    position: absolute; top: 6px; left: 10px;
    background: rgba(255,255,255,0.2);
    border: none; color: white;
    width: 22px; height: 22px;
    border-radius: 50%;
    font-size: 14px; cursor: pointer;
  }

  /* FOOTER */
  .footer {
    text-align: center;
    margin-top: 30px;
    padding: 14px;
    color: #8B7355;
    font-size: 12px;
  }
  .footer a { color: #2F5233; text-decoration: none; }
</style>
</head>
<body>

<!-- Install hint (PWA) -->
<div id="installHint" class="install-hint" style="display:none">
  <button class="close-btn" onclick="closeInstallHint(event)">×</button>
  💡 <strong>أضف التطبيق على شاشتك الرئيسية:</strong><br>
  في Safari: اضغط زر المشاركة → "إضافة إلى الشاشة الرئيسية"<br>
  في Chrome: القائمة → "إضافة إلى الشاشة الرئيسية"
</div>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div>
      <div class="title">محاسبة النفس</div>
      <div class="subtitle" id="todayDate"></div>
    </div>
    <div class="score-circle">
      <div class="score-num" id="scorePct">0%</div>
      <div class="score-label" id="scoreFrac">0/0</div>
    </div>
  </div>
  <div class="save-status" id="saveStatus"></div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" data-view="today" onclick="switchView('today')">اليوم</button>
  <button class="tab" data-view="history" onclick="switchView('history')">السجل</button>
  <button class="tab" data-view="stats" onclick="switchView('stats')">الإحصائيات</button>
</div>

<!-- MAIN CONTENT -->
<div id="mainContent"></div>

<div class="footer">
  محاسبة النفس · بياناتك تُحفظ على جوالك فقط<br>
  <span style="opacity:0.7">قال عمر: حاسِبوا أنفسَكم قبل أن تُحاسَبوا</span>
</div>

<script>
// ============ DATA ============
const CATEGORIES = [
  {
    id: 'salawat',
    title: 'الصلوات',
    icon: '🕌',
    color: '#2F5233',
    items: [
      { id: 'fajr', label: 'الفجر في وقتها', type: 'check' },
      { id: 'fajr_jamaa', label: 'الفجر في الجماعة', type: 'check' },
      { id: 'dhuhr', label: 'الظهر في وقتها', type: 'check' },
      { id: 'asr', label: 'العصر في وقتها', type: 'check' },
      { id: 'maghrib', label: 'المغرب في وقتها', type: 'check' },
      { id: 'isha', label: 'العشاء في وقتها', type: 'check' },
      { id: 'sunnah', label: 'السنن الرواتب', type: 'check' },
      { id: 'qadha', label: 'قضاء صلوات فائتة', type: 'count' },
    ],
  },
  {
    id: 'quran',
    title: 'القرآن والذكر',
    icon: '📖',
    color: '#4A7C50',
    items: [
      { id: 'quran_pages', label: 'صفحات قرآن قُرئت', type: 'count' },
      { id: 'hifz', label: 'حفظ آية/آيات جديدة', type: 'check' },
      { id: 'tadabbur', label: 'تدبر في الآيات', type: 'check' },
      { id: 'adhkar_morning', label: 'أذكار الصباح', type: 'check' },
      { id: 'adhkar_evening', label: 'أذكار المساء', type: 'check' },
      { id: 'adhkar_salah', label: 'أذكار بعد الصلوات', type: 'check' },
      { id: 'istighfar', label: 'استغفار مئة مرة', type: 'check' },
      { id: 'salaah_nabi', label: 'صلاة على النبي ﷺ', type: 'check' },
    ],
  },
  {
    id: 'qiyam',
    title: 'قيام الليل والنوافل',
    icon: '🌙',
    color: '#6B7355',
    items: [
      { id: 'qiyam', label: 'قيام الليل (ولو ركعتين)', type: 'check' },
      { id: 'witr', label: 'الوتر', type: 'check' },
      { id: 'duha', label: 'صلاة الضحى', type: 'check' },
      { id: 'saum_nafl', label: 'صيام نافلة', type: 'check' },
    ],
  },
  {
    id: 'akhlaq',
    title: 'الأخلاق والمعاملات',
    icon: '🤝',
    color: '#8B6914',
    items: [
      { id: 'birr', label: 'بَرَرتُ والديّ اليوم', type: 'check' },
      { id: 'family', label: 'أحسنتُ مع الزوجة والأبناء', type: 'check' },
      { id: 'silah', label: 'وصلتُ رحمي (اتصال/زيارة)', type: 'check' },
      { id: 'sadaqa', label: 'صدقة (ولو ريال)', type: 'check' },
      { id: 'help', label: 'أعنتُ محتاجاً', type: 'check' },
      { id: 'ihsan', label: 'إتقان في عملي وإخلاص فيه', type: 'check' },
    ],
  },
  {
    id: 'mahramat',
    title: 'المحرمات (هل اجتنبتها؟)',
    icon: '⚠️',
    color: '#8B0000',
    items: [
      { id: 'eyes', label: 'غضضتُ بصري عن المحرمات', type: 'check' },
      { id: 'tongue_ghibah', label: 'سَلِمتُ من الغيبة', type: 'check' },
      { id: 'tongue_namima', label: 'سَلِمتُ من النميمة', type: 'check' },
      { id: 'tongue_kidhb', label: 'سَلِمتُ من الكذب', type: 'check' },
      { id: 'tongue_sukhriya', label: 'سَلِمتُ من السخرية والاستهزاء', type: 'check' },
      { id: 'tongue_jadal', label: 'سَلِمتُ من الجدال والمراء', type: 'check' },
      { id: 'tongue_fuhsh', label: 'سَلِمتُ من الفحش والبذاءة', type: 'check' },
      { id: 'music', label: 'لم أستمع لمحرم (موسيقى/أغاني)', type: 'check' },
      { id: 'video', label: 'لم أشاهد محرماً', type: 'check' },
      { id: 'social_haram', label: 'لم أتعامل مع امرأة أجنبية بحرام', type: 'check' },
      { id: 'riba', label: 'لم أتعامل بالربا', type: 'check' },
      { id: 'haram_kasb', label: 'كسبي اليوم حلال كله', type: 'check' },
      { id: 'kibr', label: 'سَلِمتُ من الكِبر والعُجب', type: 'check' },
      { id: 'hasad', label: 'سَلِمتُ من الحسد', type: 'check' },
      { id: 'riya', label: 'سَلِمتُ من الرياء والسُّمعة', type: 'check' },
      { id: 'su_zann', label: 'سَلِمتُ من سوء الظن بالمسلمين', type: 'check' },
      { id: 'ghadab', label: 'تحكمتُ في غضبي', type: 'check' },
      { id: 'tajassus', label: 'سَلِمتُ من التجسس والفضول', type: 'check' },
      { id: 'isra', label: 'سَلِمتُ من الإسراف والتبذير', type: 'check' },
    ],
  },
  {
    id: 'time',
    title: 'الوقت والاجتهاد',
    icon: '⏰',
    color: '#5C4A2A',
    items: [
      { id: 'no_waste', label: 'لم أُضيع وقتاً في غير نافع', type: 'check' },
      { id: 'social_media', label: 'تجنبت الإفراط في وسائل التواصل', type: 'check' },
      { id: 'sleep_early', label: 'نمتُ مبكراً (قبل ١١)', type: 'check' },
      { id: 'sport', label: 'مارستُ الرياضة اليوم', type: 'check' },
      { id: 'ilm', label: 'تعلمتُ شيئاً نافعاً في الدين', type: 'check' },
    ],
  },
];

// ============ STATE ============
let currentView = 'today';
let todayData = {};
let todayNotes = { thanks: '', sin: '', tomorrow: '' };
let expanded = { salawat: true };
let saveTimer = null;
let selectedHistDay = null;

// ============ STORAGE (localStorage) ============
const todayKey = () => {
  const d = new Date();
  return `muhasaba:${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};

const loadDay = (key) => {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch { return null; }
};

const saveToday = () => {
  try {
    localStorage.setItem(todayKey(), JSON.stringify({ items: todayData, notes: todayNotes }));
    showStatus('تم الحفظ ✓');
  } catch (e) {
    showStatus('خطأ في الحفظ');
  }
};

const showStatus = (msg) => {
  const el = document.getElementById('saveStatus');
  el.textContent = msg;
  setTimeout(() => { el.textContent = ''; }, 1500);
};

const queueSave = () => {
  showStatus('جاري الحفظ...');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToday, 400);
};

const getAllHistory = () => {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('muhasaba:')) keys.push(k);
  }
  return keys.sort().reverse();
};

// ============ UTILITIES ============
const formatDate = (str) => {
  const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const days = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const d = new Date(str);
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
};

const catScore = (cat, data = todayData) => {
  let done = 0, total = 0;
  cat.items.forEach(item => {
    if (item.type === 'check') {
      total++;
      if (data[`${cat.id}:${item.id}`]) done++;
    }
  });
  return { done, total };
};

const overallScore = (data = todayData) => {
  let done = 0, total = 0;
  CATEGORIES.forEach(cat => {
    const s = catScore(cat, data);
    done += s.done;
    total += s.total;
  });
  return { done, total, pct: total > 0 ? Math.round((done/total)*100) : 0 };
};

const updateScoreUI = () => {
  const s = overallScore();
  document.getElementById('scorePct').textContent = s.pct + '%';
  document.getElementById('scoreFrac').textContent = `${s.done}/${s.total}`;
};

// ============ RENDER ============
const switchView = (view) => {
  currentView = view;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === view);
  });
  render();
};

const toggleCheck = (catId, itemId) => {
  const key = `${catId}:${itemId}`;
  todayData[key] = !todayData[key];
  queueSave();
  renderToday();
};

const setCount = (catId, itemId, delta) => {
  const key = `${catId}:${itemId}`;
  todayData[key] = Math.max(0, (todayData[key] || 0) + delta);
  queueSave();
  renderToday();
};

const toggleExpand = (catId) => {
  expanded[catId] = !expanded[catId];
  renderToday();
};

const updateNote = (field, value) => {
  todayNotes[field] = value;
  queueSave();
};

const renderToday = () => {
  updateScoreUI();
  const html = `
    <div class="banner">
      <div class="banner-icon">🤲</div>
      <div class="banner-text">قال عمر رضي الله عنه: <em>«حاسِبوا أنفسَكم قبل أن تُحاسَبوا»</em></div>
    </div>
    ${CATEGORIES.map(cat => {
      const s = catScore(cat);
      const isExp = expanded[cat.id];
      return `
        <div class="category">
          <div class="cat-header" style="background:${cat.color}" onclick="toggleExpand('${cat.id}')">
            <div class="cat-header-left">
              <span class="cat-icon">${cat.icon}</span>
              <span class="cat-title">${cat.title}</span>
            </div>
            <div class="cat-header-right">
              ${s.total > 0 ? `<span class="cat-score">${s.done}/${s.total}</span>` : ''}
              <span class="cat-arrow ${isExp ? '' : 'collapsed'}">▲</span>
            </div>
          </div>
          <div class="cat-body ${isExp ? 'expanded' : ''}">
            ${cat.items.map(item => {
              const k = `${cat.id}:${item.id}`;
              if (item.type === 'check') {
                const ch = !!todayData[k];
                return `
                  <div class="item-row ${ch ? 'checked' : ''}" onclick="toggleCheck('${cat.id}','${item.id}')">
                    <div class="checkbox ${ch ? 'checked' : ''}" style="${ch ? `background:${cat.color};border-color:${cat.color}` : ''}">
                      <span class="checkmark">✓</span>
                    </div>
                    <div class="item-label ${ch ? 'checked' : ''}">${item.label}</div>
                  </div>
                `;
              } else {
                const v = todayData[k] || 0;
                return `
                  <div class="item-row-count">
                    <div class="item-label">${item.label}</div>
                    <div class="counter">
                      <button class="counter-btn" style="background:${cat.color}" onclick="setCount('${cat.id}','${item.id}',-1)">−</button>
                      <span class="counter-value">${v}</span>
                      <button class="counter-btn" style="background:${cat.color}" onclick="setCount('${cat.id}','${item.id}',1)">+</button>
                    </div>
                  </div>
                `;
              }
            }).join('')}
          </div>
        </div>
      `;
    }).join('')}

    <div class="reflection">
      <div class="reflection-title">التأمل اليومي</div>
      <div class="notes-group">
        <label class="notes-label">🤍 ما النعمة التي أحمد الله عليها اليوم؟</label>
        <textarea rows="2" onchange="updateNote('thanks', this.value)" placeholder="...">${todayNotes.thanks || ''}</textarea>
      </div>
      <div class="notes-group">
        <label class="notes-label">📿 ذنب أو تقصير أتوب منه إلى الله</label>
        <textarea rows="2" onchange="updateNote('sin', this.value)" placeholder="استغفر الله وأتوب إليه...">${todayNotes.sin || ''}</textarea>
      </div>
      <div class="notes-group">
        <label class="notes-label">☀️ نيتي للغد إن أحياني الله</label>
        <textarea rows="2" onchange="updateNote('tomorrow', this.value)" placeholder="غداً بإذن الله...">${todayNotes.tomorrow || ''}</textarea>
      </div>
    </div>

    <div class="dua-card">
      <div class="dua-title">دعاء الختام</div>
      <div class="dua-text">اللهم ما عَمِلتُ اليوم من خيرٍ فتقبَّله مني، وما عَمِلتُ من سوءٍ فاغفره لي، وأَعِنّي على ما هو خيرٌ منه. اللهم لا تجعل غدي شراً من يومي، ولا يومي شراً من أمسي، وارزقني العزم على الخير، والثبات عليه.</div>
    </div>
  `;
  document.getElementById('mainContent').innerHTML = html;
};

const renderHistory = () => {
  if (selectedHistDay) { renderHistDay(); return; }
  const hist = getAllHistory();
  if (hist.length === 0) {
    document.getElementById('mainContent').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <div class="empty-text">لا توجد محاسبات سابقة بعد</div>
        <div class="empty-hint">ابدأ بمحاسبة اليوم وستظهر هنا تدريجياً</div>
      </div>`;
    return;
  }
  document.getElementById('mainContent').innerHTML = `
    <div class="hist-title">سجل المحاسبات (${hist.length})</div>
    ${hist.map(k => `
      <div class="hist-row" onclick="openHistDay('${k}')">
        <span>${formatDate(k.replace('muhasaba:',''))}</span>
        <span class="hist-row-arrow">←</span>
      </div>
    `).join('')}
  `;
};

const openHistDay = (key) => { selectedHistDay = key; render(); };
const closeHistDay = () => { selectedHistDay = null; render(); };

const renderHistDay = () => {
  const data = loadDay(selectedHistDay);
  if (!data) { closeHistDay(); return; }
  const s = overallScore(data.items || {});
  let html = `
    <button class="back-btn" onclick="closeHistDay()">→ رجوع للسجل</button>
    <div class="hist-day-title">${formatDate(selectedHistDay.replace('muhasaba:',''))}</div>
    <div class="score-circle score-circle-large">
      <div class="score-num">${s.pct}%</div>
      <div class="score-label">${s.done}/${s.total}</div>
    </div>
  `;
  CATEGORIES.forEach(cat => {
    const done = [], missed = [], counts = [];
    cat.items.forEach(item => {
      const k = `${cat.id}:${item.id}`;
      if (item.type === 'check') {
        if (data.items?.[k]) done.push(item);
        else missed.push(item);
      } else if (item.type === 'count' && data.items?.[k]) {
        counts.push({ ...item, value: data.items[k] });
      }
    });
    if (!done.length && !missed.length && !counts.length) return;
    html += `<div class="hist-cat">
      <div class="hist-cat-header" style="color:${cat.color}">${cat.icon} ${cat.title}</div>
      ${done.map(i => `<div class="hist-item"><span class="hist-check">✓</span> ${i.label}</div>`).join('')}
      ${counts.map(i => `<div class="hist-item"><span class="hist-check">📊</span> ${i.label}: ${i.value}</div>`).join('')}
      ${missed.map(i => `<div class="hist-item missed"><span class="hist-x">✗</span> ${i.label}</div>`).join('')}
    </div>`;
  });
  if (data.notes && (data.notes.thanks || data.notes.sin || data.notes.tomorrow)) {
    html += `<div class="hist-notes">
      <div class="hist-notes-title">التأمل</div>
      ${data.notes.thanks ? `<div class="hist-note"><strong>الشكر:</strong> ${data.notes.thanks}</div>` : ''}
      ${data.notes.sin ? `<div class="hist-note"><strong>التوبة:</strong> ${data.notes.sin}</div>` : ''}
      ${data.notes.tomorrow ? `<div class="hist-note"><strong>الغد:</strong> ${data.notes.tomorrow}</div>` : ''}
    </div>`;
  }
  document.getElementById('mainContent').innerHTML = html;
};

const renderStats = () => {
  const hist = getAllHistory().slice(0, 30);
  if (hist.length === 0) {
    document.getElementById('mainContent').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📊</div>
        <div class="empty-text">لا توجد بيانات بعد</div>
      </div>`;
    return;
  }
  const stats = hist.map(k => {
    const data = loadDay(k) || { items: {} };
    const s = overallScore(data.items);
    return { key: k, ...s, items: data.items };
  });

  const avgPct = Math.round(stats.reduce((sum, d) => sum + (d.total > 0 ? d.done/d.total : 0), 0) / stats.length * 100);

  // streak
  let streak = 0;
  for (const d of stats) {
    if (d.total > 0 && d.done > 0) streak++;
    else break;
  }

  // best day
  const bestDay = stats.reduce((b, d) =>
    (d.total > 0 && (d.done/d.total) > (b.total > 0 ? b.done/b.total : 0)) ? d : b, stats[0]);

  // cat aggregates
  const catTotals = {};
  CATEGORIES.forEach(cat => { catTotals[cat.id] = { ...cat, done: 0, total: 0 }; });
  stats.forEach(d => {
    CATEGORIES.forEach(cat => {
      const s = catScore(cat, d.items);
      catTotals[cat.id].done += s.done;
      catTotals[cat.id].total += s.total;
    });
  });
  const catPcts = Object.values(catTotals)
    .map(c => ({ ...c, pct: c.total > 0 ? Math.round(c.done/c.total*100) : 0 }))
    .sort((a,b) => b.pct - a.pct);

  document.getElementById('mainContent').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value">${stats.length}</div>
        <div class="stat-label">أيام محاسبة</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${avgPct}%</div>
        <div class="stat-label">المتوسط</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${streak}</div>
        <div class="stat-label">أيام متتالية</div>
      </div>
    </div>
    <div class="stat-section">
      <div class="stat-section-title">أداؤك حسب الفئة (آخر ٣٠ يوم)</div>
      ${catPcts.map(c => `
        <div class="cat-bar">
          <div class="cat-bar-label">
            <span>${c.icon} ${c.title}</span>
            <span style="color:${c.color};font-weight:bold">${c.pct}%</span>
          </div>
          <div class="cat-bar-track">
            <div class="cat-bar-fill" style="width:${c.pct}%;background:${c.color}"></div>
          </div>
        </div>
      `).join('')}
    </div>
    ${bestDay && bestDay.total > 0 ? `
      <div class="best-day">
        <div class="best-day-title">أفضل يوم لك</div>
        <div class="best-day-date">${formatDate(bestDay.key.replace('muhasaba:',''))}</div>
        <div class="best-day-score">${bestDay.done}/${bestDay.total} (${Math.round(bestDay.done/bestDay.total*100)}%)</div>
      </div>
    ` : ''}
    <div class="motivation">قال النبي ﷺ:<br><strong>«أحبُّ الأعمال إلى الله أدْوَمُها وإن قَلَّ»</strong></div>
  `;
};

const render = () => {
  if (currentView === 'today') renderToday();
  else if (currentView === 'history') renderHistory();
  else if (currentView === 'stats') renderStats();
};

const closeInstallHint = (e) => {
  e.stopPropagation();
  document.getElementById('installHint').style.display = 'none';
  localStorage.setItem('hideInstallHint', '1');
};

// ============ INIT ============
window.addEventListener('DOMContentLoaded', () => {
  // Set today's date
  document.getElementById('todayDate').textContent = formatDate(new Date().toISOString());

  // Load today's data
  const today = loadDay(todayKey());
  if (today) {
    todayData = today.items || {};
    todayNotes = today.notes || { thanks: '', sin: '', tomorrow: '' };
  }

  // Show install hint if not on home screen and not dismissed
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                       window.navigator.standalone;
  if (!isStandalone && !localStorage.getItem('hideInstallHint')) {
    document.getElementById('installHint').style.display = 'block';
  }

  render();
});
</script>
</body>
</html>
